name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff check host tools
      - run: uv run pytest host

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install platformio
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            device/firmware/.pio
          key: platformio-${{ runner.os }}-${{ hashFiles('device/firmware/platformio.ini') }}
      - run: pio test -e native
        working-directory: device/firmware
      - run: pio run -e m5stickc-plus-se
        working-directory: device/firmware
