services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  bridge:
    profiles: ["bridge"]
    build:
      context: host
      dockerfile: ../infra/bridge.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ROAM_MQTT_HOST: mosquitto
    ports:
      - "${ROAM_BIND:-127.0.0.1}:${ROAM_PORT:-8000}:8000"
    depends_on:
      - mosquitto
