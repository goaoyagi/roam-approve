[project]
name = "roam-approve-adapters"
version = "0.1.0"
requires-python = ">=3.11"
# Intentionally zero runtime dependencies: the hook CLI runs on every
# agent tool call, so it must stay stdlib-only for fast cold starts.
dependencies = []

[project.scripts]
roam-approve-hook = "roam_approve_adapters.cli:main"
roam-approve-watch = "roam_approve_adapters.cli:watch_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roam_approve_adapters"]
