[env:m5stickc-plus-se]
platform = espressif32
board = m5stick-c
framework = arduino
lib_deps =
    m5stack/M5StickCPlus@^0.1.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
build_flags =
    ; Example: inject secrets from the shell env instead of config.h
    ; -DDEVICE_TOKEN=\"${sysenv.ROAM_DEVICE_TOKEN}\"

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DNATIVE
